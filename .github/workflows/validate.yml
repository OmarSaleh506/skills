name: validate

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check manifests, frontmatter, README rows
        run: python3 .github/scripts/validate_skills.py
      - name: Compile bundled Python
        run: python3 -m py_compile $(git ls-files 'skills/**/*.py')
      - name: Syntax-check bundled shell scripts
        run: for f in $(git ls-files 'skills/**/*.sh'); do bash -n "$f"; done
